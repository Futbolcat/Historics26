<!DOCTYPE html>
<html lang="ca">
  <head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <link rel="icon" type="image/png" href="img/LogoTHFC_100.png">
    <link rel="stylesheet" href="css/plantilles.css">
    <title>Torneig d'Històrics 2026 - Equips</title>
  </head>
  <body>
  
	<header>

		<div class="logo-container">
			<img id="imgTorneo" class="logo" src="" alt="Logo Torneig">
		</div>

		<div class="titulo-header">
			<h1>Torneig d'Històrics - 2026</h1>
			<a class="enlace-torneig" href="https://futbolcat.github.io/Historics26/" target="_blank">
				📅 Veure calendari Torneig Històrics
			</a>
		</div>

		<div class="logo-container">
			<img id="imgClub" class="logo" src="" alt="Logo Club">
		</div>

	</header>

    <div class="contenedor">
     
      <div class="controles">
        <!-- FRANJA SUPERIOR: Todo en una sola fila recta en PC -->
        <div class="fila-superior-busqueda">
          <div class="selector-bloque">
            <img id="escudoClub" class="escudo-club" src="" alt="Escut">
            <select id="equipo" onchange="cambiarEscudo()">
              <option value="">Tria equip</option>
            </select>
          </div>
          
          <button onclick="buscar()" style="width: auto; min-width: 110px; background-color: #CF2732;">Cerca</button>
          
          <!-- LEYENDA INTEGRADA EN LA MISMA LÍNEA -->
          <div class="separador-botones" style="margin: 0; border: none; padding: 0; width: auto; display: flex; gap: 12px;">
            <div class="leyenda-item"><span class="leyenda-circulo" style="background-color: #38761d;"></span><span>Continua</span></div>
            <div class="leyenda-item"><span class="leyenda-circulo" style="background-color: #1155cc;"></span><span>Possible fitxatge</span></div>
            <div class="leyenda-item"><span class="leyenda-circulo" style="background-color: #cc0000;"></span><span>Possible baixa</span></div>
            <div class="leyenda-item"><span class="leyenda-circulo" style="background-color: #674ea7;"></span><span>Possible destí</span></div>
          </div>
          
          <button id="btnSub23" onclick="buscarSub23()" style="background-color: #CF2732; width: auto; min-width: 110px; margin-left: 100px;">Sub-23</button>
        </div>
        
        <!-- FRANJA INFERIOR: El buscador de jugadores aparece abajo, alineado al desplegable del club -->
        <div id="bloqueJugador" class="bloque-jugador">
          <select id="jugador" onchange="detectarMiembro()">
            <option value="">Tria jugador</option>
          </select>
        </div>
      </div>


      
      <div id="resultado"></div>
    </div>
    <script src="js/plantilles.js"></script>
  </body>
</html>
